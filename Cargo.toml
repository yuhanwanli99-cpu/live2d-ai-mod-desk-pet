[package]
name = "live2d-ai-mod-desk-pet"
description = "桌面透传桌宠 Mod（稳定 id desk-pet，2026-11-16）：只持有配置与可观测状态；透传窗仍在宿主 live2d-ai-desktop 的 desk_pet/，本 crate 不链 Win32 / wgpu / OffscreenRenderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
authors = ["Sakura Motion Project"]

# 依赖方向只有「Mod → 主仓」：只用 Mod 系统契约，**不用 runtime**（本 Mod 不读
# 密钥、不读 .env、不发网络请求）。不依赖 live2d-ai-desktop / l2d，不链接 user32。
[dependencies]
live2d-ai-mod-system = { path = "../Live2D-Ai/crates/live2d-ai-mod-system" }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

# 独立 workspace（仓库根 = crate 根）：本仓可以单独跑门禁，不并进主仓 workspace。
[workspace]
